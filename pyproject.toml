[project]
name = "airctl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbus-next>=0.2.3",
    "nuitka>=2.8.10",
    "pre-commit>=4.7.0",
    "pygobject>=3.54.5",
    "rich>=14.3.2",
    "ruff>=0.17.1",
    "speedtest-cli>=2.1.3",
]

[project.scripts]
airctl = "airctl.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["airctl"]

[tool.setuptools.package-data]
airctl = ["styles/*.css", "assets/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "F403"]
